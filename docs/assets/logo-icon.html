<!doctype html>
<!-- SciAgent uygulama ikonu: 512x512 kare, lacivert zemin, atom merkezde. -->
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: #071b33; }
  #icon {
    width: 512px;
    height: 512px;
    background: #071b33;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div id="icon">
    <svg width="400" height="400" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="orbit" x1="0" y1="0" x2="100" y2="100">
          <stop offset="0" stop-color="#4fc3ff" />
          <stop offset="1" stop-color="#0088ff" />
        </linearGradient>
      </defs>
      <g stroke="url(#orbit)" stroke-width="4.5" stroke-linecap="round">
        <ellipse cx="50" cy="50" rx="44" ry="17" />
        <ellipse cx="50" cy="50" rx="44" ry="17" transform="rotate(60 50 50)" />
        <ellipse cx="50" cy="50" rx="44" ry="17" transform="rotate(-60 50 50)" />
      </g>
      <circle cx="50" cy="50" r="8.5" fill="#e8ecf6" />
      <circle cx="94" cy="50" r="4.5" fill="#0088ff" />
      <circle cx="28" cy="15.9" r="4.5" fill="#4fc3ff" />
    </svg>
  </div>
</body>
</html>
