name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt && python -m pip check
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          SCI_AGENT_PYTHON: ${{ env.pythonLocation }}/bin/python
          SCI_AGENT_REQUIRE_SANDBOX_TESTS: "1"
      - run: npm audit --omit=dev --audit-level=high
