name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11.15+ for OIDC trusted publishing
        run: npm install -g npm@11.15.0

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag $TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Tests are enforced by the dedicated test.yml workflow, which installs
      # the Python scientific stack and Bubblewrap needed for zero skips.

      - name: Build npm tarball
        run: node scripts/build-packages.mjs

      - name: Publish to npm with provenance
        working-directory: dist-npm/package
        run: npm publish --provenance --access public
